  history.replaceState(null,'',location.pathname);

  say(ok?'Payment received. Your wallet was funded.':'Payment is not confirmed yet. If you paid, your wallet will update shortly.',!ok);S.tab='wallet';S.sub='';render()}catch(x){}
}

async function copyTxt(t){try{await navigator.clipboard.writeText(t);say('Link copied.')}catch(e){window.prompt('Copy:',t)}}

document.addEventListener('click',async function(e){
 var el=e.target.closest('[data-mode],[data-tab],[data-sub],[data-back],[data-ap],[data-rs],#go,#vf,#rsd,#lang,#lang2,#tsend,#wapply,#out,#share,#dark,#copy,#eye,#fund,[data-eye],#fg,#rst,[data-net],[data-plan],[data-rq],#pay,#buy,#buyair,#savepin,#sync');if(!el)return;

 if(d.net){S.net=d.net;S.plan=null;return render()}
 if(d.plan){S.plan=d.plan;return render()}
 if(d.rq){try{var rq=await api({action:'requery',reference:d.rq});say(rq.status=='success'?'Purchase successful.':rq.status=='failed'?'Purchase failed. Your money was returned.':'Still processing. Check again later.',rq.status=='failed')}catch(x){say(x.message,1)}return render()}
 if(id=='pay'){var am0=Math.floor(Number($('fa').value));if(!(am0>=100&&am0<=500000)){say('Enter an amount from ₦100 to ₦500,000.',1);return render()}
  el.disabled=true;try{var pr=await api({action:'init-payment',amount:am0});location.href=pr.url;return}catch(x){say(x.message,1);return render()}}
 if(id=='buy'||id=='buyair'){var ph0=$('bph').value.trim(),pin0=$('bpin').value.trim();
  if(!/^0\d{10}$/.test(ph0)){say('Enter a valid 11-digit phone number.',1);return render()}
  if(!/^\d{4}$/.test(pin0)){say('Enter your 4-digit transaction PIN.',1);return render()}
  var bd={action:'buy',phone:ph0,pin:pin0};
  if(id=='buy'){bd.kind='data';bd.plan_id=S.plan}else{var am1=Math.floor(Number($('bamt').value));if(!(am1>=50&&am1<=50000)){say('Enter airtime from ₦50 to ₦50,000.',1);return render()}bd.kind='airtime';bd.network=S.net||'MTN';bd.amount=am1}
  el.disabled=true;
  try{var br=await api(bd);S.plan=null;say(br.status=='success'?'Purchase successful.':br.status=='failed'?'Purchase failed. Your money was returned.':'Purchase is processing. Check Transactions for the result.',br.status=='failed')}catch(x){say(x.message,1)}
  return render()}
 if(id=='savepin'){var np=$('npin').value.trim(),cp=$('cpin').value.trim(),op=$('opin')?$('opin').value.trim():'';
  if(!/^\d{4}$/.test(np)){say('PIN must be 4 digits.',1);return render()}
  if(np!==cp){say('PINs do not match.',1);return render()}
  try{await api({action:'set-pin',pin:np,old_pin:op});say('PIN saved.')}catch(x){say(x.message,1)}return render()}
 if(id=='sync'){var rm=Number($('rm').value||0),wm=Number($('wm').value||0);
  if(!(rm>0)||!(wm>=0)){say('Enter your profit margins in naira.',1);return render()}
  el.disabled=true;try{var sr=await api({action:'sync-plans',retail_margin:rm,wholesale_margin:wm});say(sr.plans+' plans loaded.')}catch(x){say(x.message,1)}return render()}
 if(d.eye){var inp=$(d.eye);inp.type=inp.type=='password'?'text':'password';return}
 if(d.mode){S.mode=d.mode;say('');return authView()}
 if(id=='fg'){var em2=$('em').value.trim();if(!/^\S+@\S+\.\S+$/.test(em2)){say('Enter a valid email.',1);return pwView()}
  var rf2=await sb.auth.resetPasswordForEmail(em2,{redirectTo:location.origin+location.pathname});say(rf2.error?rf2.error.message:'A reset link was sent to your email.',!!rf2.error);return pwView()}
 if(id=='rst'){var a1=$('pw').value,a2=$('pw2').value;if(a1.length<8){say('Password must be at least 8 characters.',1);return pwView()}if(a1!==a2){say('Passwords do not match.',1);return pwView()}
  var u2=await sb.auth.updateUser({password:a1});if(u2.error){say(u2.error.message,1);return pwView()}
  S.rec=false;S.mode='login';say('Password changed.');try{history.replaceState(null,'',location.pathname)}catch(x){}return boot()}
 if(id=='go')return doAuth();
 if(id=='lang'||id=='lang2')return setLang(LANG=='ha'?'en':'ha');
 if(id=='vf'){var c=$('otp').value.trim();if(c.length<6){say('Enter the code from your email.',1);return authView()}
  var v=await sb.auth.verifyOtp({email:S.pend,token:c,type:'signup'});if(v.error){say(v.error.message,1);return authView()}
  say('');return boot()}
 if(id=='rsd'){var rr=await sb.auth.resend({type:'signup',email:S.pend});say(rr.error?rr.error.message:'A new code was sent.',!!rr.error);return authView()}
 if(d.tab){S.tab=d.tab;S.sub='';say('');return render()}

 if(d.back!==undefined){S.sub='';say('');return render()}
 if(id=='eye'){S.hide=!S.hide;ls('rgd_hide',S.hide?'1':'0');return render()}

 if(id=='copy'){await copyTxt(refLink());return render()}
 if(id=='share'){var url=refLink();if(navigator.share){try{await navigator.share({title:'RABSON G DATA',url:url})}catch(x){}return}await copyTxt(url);return render()}
 if(id=='fund'){say('Funding opens in Phase 3 after Paystack/Flutterwave is connected and tested.');return render()}
 if(id=='out'){await sb.auth.signOut();S.tab='home';S.sub='';S.user=null;return boot()}
 if(id=='tsend'){var s=$('ts').value.trim(),m=$('tm').value.trim();if(!s||!m){say('Fill subject and message.',1);return render()}
  var r=await sb.from('support_tickets').insert({user_id:S.user.id,subject:s,message:m});say(r.error?r.error.message:'Ticket sent. We will reply soon.',!!r.error);return render()}
 if(id=='wapply'){var n=$('bn').value.trim();if(n.length<2){say('Enter your business name.',1);return render()}
  var r2=await sb.from('wholesale_accounts').insert({user_id:S.user.id,business_name:n,status:'pending'});say(r2.error?r2.error.message:'Application sent. Awaiting admin approval.',!!r2.error);return render()}
 if(d.ap){var r3=await sb.from('wholesale_accounts').update({status:'approved',approved_by:S.user.id,approved_at:new Date().toISOString()}).eq('user_id',d.ap);
  if(!r3.error)await sb.from('admin_audit_logs').insert({admin_id:S.user.id,action:'approve_wholesale',target:d.ap});say(r3.error?r3.error.message:'Approved.',!!r3.error);return render()}
 if(d.rs){var r4=await sb.from('support_tickets').update({status:'resolved'}).eq('id',d.rs);say(r4.error?r4.error.message:'Resolved.',!!r4.error);return render()}
});

boot();
